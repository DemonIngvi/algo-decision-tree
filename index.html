    freq := make(map[int]int)
    for _, num := range nums {
        freq[num]++
    }
    buckets := make([][]int, len(nums)+1) // частота 1..len(nums)

        buckets[f] = append(buckets[f], num)

        return false

func worker(ctx context.Context, jobs <-chan string, out chan<- int) {

type item struct{ node, dist int }
type minHeap []item

func (h minHeap) Len() int           { return len(h) }
func (h minHeap) Less(i, j int) bool { return h[i].dist < h[j].dist }
func (h minHeap) Swap(i, j int)      { h[i], h[j] = h[j], h[i] }
func (h *minHeap) Push(x any)        { *h = append(*h, x.(item)) }
func (h *minHeap) Pop() any {
    old := *h
    x := old[len(old)-1]
    *h = old[:len(old)-1]
    return x
}

func networkDelayTime(times [][]int, n int, k int) int {
    g := make([][][2]int, n+1) // g[u] = {v, вес}
    for _, t := range times {
        g[t[0]] = append(g[t[0]], [2]int{t[1], t[2]})
    }
    dist := make([]int, n+1)
    for i := range dist {
        dist[i] = math.MaxInt
    }
    dist[k] = 0
    h := &minHeap{{k, 0}}
    for h.Len() > 0 {
        cur := heap.Pop(h).(item)
        if cur.dist > dist[cur.node] {
            continue // устаревшая запись
        }
        for _, e := range g[cur.node] {
            if nd := cur.dist + e[1]; nd < dist[e[0]] {
                dist[e[0]] = nd
                heap.Push(h, item{e[0], nd})
            }
        }
    }
    ans := 0
    for i := 1; i <= n; i++ {
        if dist[i] == math.MaxInt {
            return -1
        }
        ans = max(ans, dist[i])
    }
    return ans
}`,

func shortestPath(g [][]int, start, target int) int {
    dist := make([]int, len(g))
    for i := range dist {
        dist[i] = -1
    }
    dist[start] = 0
    queue := []int{start}
    for len(queue) > 0 {
        v := queue[0]
        queue = queue[1:]
        if v == target {
            return dist[v]
        }
        for _, u := range g[v] {
            if dist[u] == -1 { // помечаем при добавлении в очередь
                dist[u] = dist[v] + 1
                queue = append(queue, u)
            }
        }
    }
    return -1
}`,

func canFinish(numCourses int, prerequisites [][]int) bool {
    g := make([][]int, numCourses)
    indeg := make([]int, numCourses)
    for _, p := range prerequisites { // p = [курс, пререквизит]
        g[p[1]] = append(g[p[1]], p[0])
        indeg[p[0]]++
    }
    queue := []int{}
    for i, d := range indeg {
        if d == 0 {
            queue = append(queue, i)
        }
    }
    done := 0
    for len(queue) > 0 {
        v := queue[0]
        queue = queue[1:]
        done++
        for _, u := range g[v] {
            indeg[u]--
            if indeg[u] == 0 {
                queue = append(queue, u)
            }
        }
    }
    return done == numCourses // иначе в графе цикл
}`,
"Union-Find (DSU)":`// LC 684. Redundant Connection
type DSU struct{ parent, rank []int }

func NewDSU(n int) *DSU {
    d := &DSU{make([]int, n), make([]int, n)}
    for i := range d.parent {
        d.parent[i] = i
    }
    return d
}

func (d *DSU) Find(x int) int {
    if d.parent[x] != x {
        d.parent[x] = d.Find(d.parent[x]) // сжатие путей
    }
    return d.parent[x]
}

func (d *DSU) Union(a, b int) bool {
    ra, rb := d.Find(a), d.Find(b)
    if ra == rb {
        return false // уже в одной компоненте
    }
    if d.rank[ra] < d.rank[rb] {
        ra, rb = rb, ra
    }
    d.parent[rb] = ra
    if d.rank[ra] == d.rank[rb] {
        d.rank[ra]++
    }
    return true
}

func findRedundantConnection(edges [][]int) []int {
    d := NewDSU(len(edges) + 1)
    for _, e := range edges {
        if !d.Union(e[0], e[1]) {
            return e
        }
    }
    return nil
}`,

func levelOrder(root *TreeNode) [][]int {
    var res [][]int
    if root == nil {
        return res
    }
    queue := []*TreeNode{root}
    for len(queue) > 0 {
        size := len(queue) // фиксируем размер уровня
        level := make([]int, 0, size)
        for i := 0; i < size; i++ {
            n := queue[0]
            queue = queue[1:]
            level = append(level, n.Val)
            if n.Left != nil {
                queue = append(queue, n.Left)
            }
            if n.Right != nil {
                queue = append(queue, n.Right)
            }
        }
        res = append(res, level)
    }
    return res
}`,

func isValidBST(root *TreeNode) bool {
    var check func(n *TreeNode, lo, hi int) bool
    check = func(n *TreeNode, lo, hi int) bool {
        if n == nil {
            return true
        }
        if n.Val <= lo || n.Val >= hi {
            return false
        }
        // границы передаются вниз, а не только сравнение с детьми
        return check(n.Left, lo, n.Val) && check(n.Right, n.Val, hi)
    }
    return check(root, math.MinInt, math.MaxInt)
}

func orangesRotting(grid [][]int) int {
    m, n := len(grid), len(grid[0])
    queue := [][2]int{}
    fresh := 0
    for i := 0; i < m; i++ {
        for j := 0; j < n; j++ {

            case 2:
                queue = append(queue, [2]int{i, j})

  L("Два указателя: палиндром","Проверить палиндром, игнорируя регистр и знаки.","left и right идут навстречу, лишние символы пропускаются через continue.","O(n)","125 · 680 · 344","strings.ToLower копирует строку (O(n) памяти); байты верны только для ASCII.","pal",[V1,"видео 1, LC 125"]),
IF("Много запросов суммы на отрезке?",
  L("Префиксные суммы","Сумма [l..r] много раз, произведение кроме себя.","pref[i+1] = pref[i] + a[i]; сумма = pref[r+1] − pref[l].","O(n) + O(1) на запрос","303 · 238 · 724","Сдвиг индексов на 1 убирает частные случаи."),
  L("Линейный проход / сортировка","Ничего из выше не подошло: часто хватает одного прохода или сортировки.","Посчитать за один проход с несколькими переменными или отсортировать и пройти.","O(n) / O(n log n)","121 · 53 · 169","Не усложнять: сначала назвать простое решение и его сложность.")))))))))))))));

// ---------- подсветка ----------
var KW="break case chan const continue default defer else fallthrough for func go goto if import interface map package range return select struct switch type var".split(" ");
var TY="int int32 int64 uint32 byte rune string bool any error".split(" ");
var LIT="nil true false iota".split(" ");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
var re=/(\/\/[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(\b\d+\b)|([A-Za-z_][A-Za-z0-9_]*)(?=\s*\()|([A-Za-z_][A-Za-z0-9_]*)/g;
function hl(src){var out="",last=0,m;re.lastIndex=0;
  while((m=re.exec(src))){out+=esc(src.slice(last,m.index));var t=m[0],cls="";
    if(m[1])cls=/\[правка\]/.test(t)?"tc tfix":"tc";else if(m[2])cls="ts";else if(m[3])cls="tn";
    else{var w=m[4]||m[5];if(KW.indexOf(w)>=0)cls="tk";else if(TY.indexOf(w)>=0)cls="tt";else if(LIT.indexOf(w)>=0)cls="tn";else if(m[4])cls="tf";}
    out+=cls?'<span class="'+cls+'">'+esc(t)+"</span>":esc(t);last=re.lastIndex;}
  return out+esc(src.slice(last));}



// ---------- раскладка: «да» вправо, «нет» вниз ----------
var COLW=250,BOXW=214,ROWH=58,BOXH=44;
var nodes=[],edges=[];
function place(n,col,row,parent,kind){
  n.col=col;n.row=row;n.parent=parent;n.kind=kind;n.idx=nodes.length;nodes.push(n);
  if(!n.q)return 1;
  var h1=place(n.y,col+1,row,n,"y");
  var h2=place(n.n,col,row+h1,n,"n");
  edges.push({a:n,b:n.y,k:"y"},{a:n,b:n.n,k:"n"});
  return h1+h2;
}
var rows=place(ROOT,0,0,null,null);
var maxCol=0;nodes.forEach(function(n){if(n.col>maxCol)maxCol=n.col});
var W=(maxCol)*COLW+BOXW,H=rows*ROWH;
var canvas=document.getElementById("canvas"),svg=document.getElementById("edges");
canvas.style.width=W+"px";canvas.style.height=H+"px";
svg.setAttribute("width",W);svg.setAttribute("height",H);
function X(n){return n.col*COLW}function Y(n){return n.row*ROWH}
function esc2(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
nodes.forEach(function(n){
  var d=document.createElement("div");d.className="nd "+(n.q?"q":"l");
  d.style.left=X(n)+"px";d.style.top=Y(n)+"px";d.style.width=BOXW+"px";d.style.height=BOXH+"px";
  d.textContent=n.q||n.name;d.title=n.q||n.name;
  d.onclick=function(){select(n.idx)};
  n.el=d;canvas.appendChild(d);
});
var NS="http://www.w3.org/2000/svg",svgh="";
edges.forEach(function(e,i){
  var a=e.a,b=e.b,dpath,tx,ty;
  if(e.k==="y"){var x1=X(a)+BOXW,y1=Y(a)+BOXH/2,x2=X(b),y2=Y(b)+BOXH/2;dpath="M"+x1+" "+y1+"H"+x2;tx=x1+8;ty=y1-6;}
  else{var x1=X(a)+22,y1=Y(a)+BOXH,y2=Y(b);dpath="M"+x1+" "+y1+"V"+y2;tx=x1+6;ty=y1+14;}
  e.id="e"+i;
  svgh+="<path id='e"+i+"' d='"+dpath+"'/><text class='"+e.k+"' x='"+tx+"' y='"+ty+"'>"+(e.k==="y"?"да":"нет")+"</text>";
});
svg.innerHTML=svgh;
// стрелки на концах — маленькие треугольники через marker не обязательны; добавим точку
edges.forEach(function(e){e.el=document.getElementById(e.id)});

// ---------- панель ----------
var panel=document.getElementById("panel"),cur=null;
function leavesOf(n,acc){if(!n.q){acc.push(n);return acc}leavesOf(n.y,acc);leavesOf(n.n,acc);return acc}
function select(i){
  var n=nodes[i];cur=n;
  nodes.forEach(function(m){m.el.classList.remove("on","sel")});
  edges.forEach(function(e){e.el.classList.remove("on")});
  var m=n;while(m){m.el.classList.add("on");if(m.parent){edges.forEach(function(e){if(e.b===m)e.el.classList.add("on")})}m=m.parent}
  if(!n.q)n.el.classList.add("sel");
  var h,src=n.q?null:((n.code&&C[n.code])||EX[n.name]);
  if(n.q){
    h="<div class='kick'>Условие</div><h2>if "+esc2(n.q)+"</h2>"+
      "<div class='br'><b class='y'>да →</b><span>"+leavesOf(n.y,[]).map(function(l){return "<a data-i='"+l.idx+"'>"+esc2(l.name)+"</a>"}).join(", ")+"</span>"+
      "<b class='n'>нет ↓</b><span>"+leavesOf(n.n,[]).map(function(l){return "<a data-i='"+l.idx+"'>"+esc2(l.name)+"</a>"}).join(", ")+"</span></div>"+
      "<p class='hint' style='margin-top:14px'>Нажми на зелёный лист в дереве или на алгоритм выше, чтобы открыть описание.</p>";
  } else {
    h="<div class='kick'>Алгоритм</div><h2>"+esc2(n.name)+"</h2>"+
      
      "<span class='cplx'>"+esc2(n.c)+"</span><span class='pill'>LeetCode: "+esc2(n.lc)+"</span>"+
      "<div class='sec'><h3>Когда выбирать</h3><div class='when'>"+esc2(n.w)+"</div></div>"+
      "<div class='sec'><h3>Идея</h3><p>"+esc2(n.i)+"</p></div>"+
      "<div class='sec'><h3>Ловушка</h3><div class='trap'>"+esc2(n.t)+"</div></div>"+
      (src?"<div class='sec'><h3>Пример решения (Go)</h3><pre class='code'><code>"+hl(src)+"</code></pre></div>":"")+
      (n.v?"<div class='sec src'>Источник: <a href='"+n.v[0]+"' target='_blank' rel='noopener'>"+esc2(n.v[1])+"</a></div>":"");
  }
  panel.innerHTML=h;panel.scrollTop=0;
  panel.querySelectorAll("a[data-i]").forEach(function(a){a.onclick=function(){var t=nodes[+a.dataset.i];select(t.idx);t.el.scrollIntoView({block:"center",inline:"center",behavior:"smooth"})}});
  history.replaceState(null,"","#"+i);
}
document.getElementById("theme").onclick=function(){
  var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("algoTreeTheme",r.dataset.theme)}catch(e){}
};
try{var th=localStorage.getItem("algoTreeTheme");if(th)document.documentElement.dataset.theme=th}catch(e){}
// ---------- перетаскиваемый разделитель ----------
(function(){
  var app=document.querySelector(".app"),sp=document.getElementById("split"),KEY="algoTreeRightW";
  function setW(px){
    var w=Math.max(300,Math.min(window.innerWidth-260,px));
    app.style.setProperty("--rw",w+"px");return w;
  }
  try{var saved=parseInt(localStorage.getItem(KEY),10);if(saved)setW(saved)}catch(e){}
  sp.addEventListener("pointerdown",function(e){
    e.preventDefault();sp.setPointerCapture(e.pointerId);sp.classList.add("drag");document.body.classList.add("dragging");
    function move(ev){setW(window.innerWidth-ev.clientX-4)}
    function up(ev){
      sp.releasePointerCapture(ev.pointerId);sp.classList.remove("drag");document.body.classList.remove("dragging");
      sp.removeEventListener("pointermove",move);sp.removeEventListener("pointerup",up);
      try{localStorage.setItem(KEY,parseInt(getComputedStyle(app).getPropertyValue("--rw"),10))}catch(e){}
    }
    sp.addEventListener("pointermove",move);sp.addEventListener("pointerup",up);
  });
  sp.addEventListener("dblclick",function(){app.style.removeProperty("--rw");try{localStorage.removeItem(KEY)}catch(e){}});
  window.addEventListener("resize",function(){var v=app.style.getPropertyValue("--rw");if(v)setW(parseInt(v,10))});
})();
var h0=parseInt(location.hash.slice(1),10);select(nodes[h0]?h0:0);
})();
</script>
